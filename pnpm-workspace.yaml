# Postinstall scripts stay disabled: all three ship prebuilt binaries via
# optionalDependencies, and CI has always run with their builds ignored.
allowBuilds:
  esbuild: false
  protobufjs: false
  sharp: false
  workerd: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0
  '@vitest/browser-playwright': 5.0.3
overrides:
  vite@*: 'catalog:'
  vitest@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
